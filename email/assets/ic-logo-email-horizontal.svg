<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" role="img" aria-label="Inspiring Connections">
  <!-- Horizontal email lockup: butterfly circle mark + "Inspiring Connections"
       wordmark. Montserrat-style geometric letters drawn as text (rasterised to
       PNG, so the font need not be installed by the mail client). -->
  <defs>
    <style>
      .teal { fill: #1B9894; }
      .orange { fill: #E1702F; }
      .body { fill: #1B2B34; }
      .ring { fill: none; stroke: #1B9894; stroke-width: 22; }
    </style>
  </defs>
  <!-- Mark (scaled IC circle, 0..800 → 20..240) -->
  <g transform="translate(10,10) scale(0.3)">
    <circle class="ring" cx="400" cy="400" r="378"/>
    <path class="body" d="M395 345c10-25 0-55 5-80 2-11 16-11 18 0 5 25-5 55 5 80 7 18 20 33 20 60 0 26-19 48-44 48s-44-22-44-48c0-27 13-42 20-60z"/>
    <path class="body" d="M400 270c-8-30-24-46-24-46 10 0 24 18 24 18s14-18 24-18c0 0-16 16-24 46z"/>
    <path class="body" d="M372 252c-18-22-40-36-40-36 18 0 40 20 40 20s22-20 40-20c0 0-22 14-40 36z"/>
    <path class="teal" d="M400 400c-80-10-142-60-170-110-20-36-8-78 30-94 40-16 94 2 128 44 10 12 18 26 22 40 0 0-38-24-72-12-24 8-36 30-24 50 18 30 70 40 86 82z"/>
    <path class="teal" d="M400 400c-70-6-120-2-160 24-34 22-38 62-10 86 32 28 96 24 142-10 14-10 28-24 36-40-10-20-6-40-8-60z"/>
    <path class="orange" d="M400 400c80-10 142-60 170-110 20-36 8-78-30-94-40-16-94 2-128 44-10 12-18 26-22 40 0 0 38-24 72-12 24 8 36 30 24 50-18 30-70 40-86 82z"/>
    <path class="orange" d="M400 400c70-6 120-2 160 24 34 22 38 62 10 86-32 28-96 24-142-10-14-10-28-24-36-40 10-20 6-40 8-60z"/>
  </g>
  <!-- Wordmark -->
  <text x="290" y="120" font-family="Montserrat, 'Trebuchet MS', Arial, sans-serif" font-weight="800" font-size="76" letter-spacing="-1.5" fill="#2D2D2D">Inspiring</text>
  <text x="290" y="206" font-family="Montserrat, 'Trebuchet MS', Arial, sans-serif" font-weight="800" font-size="76" letter-spacing="-1.5" fill="#1B9894">Connections</text>
</svg>
